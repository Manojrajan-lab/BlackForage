[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockforge"
version = "0.1.0"
description = "BlockForge: a Proof-of-Work cryptocurrency node (Python, FastAPI, SQLite)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "coincurve>=20",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<0.25", "httpx>=0.27,<0.28"]

[project.scripts]
blockforge-wallet = "blockforge.wallet.wallet:main"

[tool.setuptools.packages.find]
include = ["blockforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"